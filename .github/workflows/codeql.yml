# CodeQL — semantic security analysis (taint tracking: SQL injection, XSS,
# path traversal, unsafe deserialization, etc.). Free for public repositories,
# unlike SonarQube's paid security editions.
#
# Docs: https://docs.github.com/code-security/code-scanning

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly baseline scan to catch newly published queries.
  # (POSIX cron — GitHub Actions does not support Jenkins-style `H`.)
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          # security-and-quality = security queries + maintainability queries.
          queries: security-and-quality

      # JS/TS needs no build step; CodeQL extracts directly from source.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
