# iOS Release archive — the only check that compiles the app for iOS.
# Jenkins builds Android on Linux; this job archives a Release build for
# devices (unsigned) and checks what App Store Connect checks on upload:
# identifiers and versions, the iOS 26 SDK, permissions, App Transport
# Security and the privacy manifests. Signing and upload stay with EAS.
#
# It runs on main, by hand, and on pull requests that can change the native
# build (about 25 minutes on a macOS runner).

name: iOS release archive

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - app.json
      - package.json
      - pnpm-lock.yaml
      - patches/**
      - plugins/**
      - packages/**
      - scripts/validate-ios-archive.py
      - .github/workflows/ios-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  archive:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize pinned submodules
        run: bash scripts/init-submodules.sh

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: 26

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Proxima Nova fonts are licensed and never leave the release hosts.
      # This archive is not distributed, so any TrueType font under their file
      # names lets the native build register them.
      - name: Stand in for the licensed fonts
        run: |
          stand_in=node_modules/@react-native-vector-icons/material-icons/fonts/MaterialIcons.ttf
          cp "$stand_in" src/assets/fonts/proximanova-reg.ttf
          cp "$stand_in" src/assets/fonts/proximanova-bold.ttf

      - name: Generate the iOS project
        run: pnpm exec expo prebuild --platform ios --no-install

      - name: Install pods
        run: pod install --project-directory=ios

      - name: Archive Release for devices (unsigned)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/RdioAnimu.xcworkspace -scheme RdioAnimu \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Animu.xcarchive" \
            archive CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/ios-archive.log"

      - name: Check the archive against App Store requirements
        run: |
          python3 scripts/validate-ios-archive.py "$RUNNER_TEMP/Animu.xcarchive" app.json \
            | tee "$RUNNER_TEMP/ios-archive-validation.json"

      - name: Upload the build log and validation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release-archive
          path: |
            ${{ runner.temp }}/ios-archive.log
            ${{ runner.temp }}/ios-archive-validation.json
            ios/Podfile.lock
          retention-days: 14
          if-no-files-found: warn
