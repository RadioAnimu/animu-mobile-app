name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Initialize pinned submodules
        run: bash scripts/init-submodules.sh

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Configure download stores
        run: |
          echo "YARN_GLOBAL_FOLDER=$RUNNER_TEMP/animu-yarn" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/animu-tools" >> "$GITHUB_ENV"

      - name: Cache isolated library downloads and verified tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.YARN_GLOBAL_FOLDER }}
            ${{ env.XDG_CACHE_HOME }}/animu-gitleaks-*
          key: ${{ runner.os }}-${{ runner.arch }}-library-downloads-${{ hashFiles('packages/react-native-anything-player/yarn.lock', 'scripts/check-secrets.mjs') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tooling regression tests
        run: |
          pnpm run test:tooling
          python3 -m unittest discover -s scripts/__tests__ -p '*_test.py'

      - name: Typecheck
        run: pnpm run typecheck

      # Fails when an Expo-managed package drifts from the installed SDK's
      # validated version (packages deliberately off-SDK are listed in
      # expo.install.exclude).
      - name: Expo SDK dependency check
        run: pnpm run check:expo-deps

      # Project health: app config schema, duplicate native modules, SDK
      # compatibility, prebuild-config sync.
      - name: Expo Doctor
        run: pnpm run check:expo-doctor

      # Known-vulnerability gate on the resolved dependency tree.
      - name: Secret scan (complete app and library history)
        run: pnpm run check:secrets

      - name: Dependency audit
        run: pnpm run check:audit

      # `pnpm run lint` runs all three; split so the failing one is obvious.
      - name: Lint (ESLint)
        run: pnpm run lint:eslint

      # oxlint's type-aware rules, run by tsgolint (typescript-go).
      - name: Lint (type-aware, oxlint + tsgolint)
        run: pnpm run lint:types

      # Unused files/exports/dependencies (knip) and package.json consistency
      # (sherif).
      - name: Lint (dependencies, knip + sherif)
        run: pnpm run lint:deps

      - name: Test (with coverage)
        run: pnpm test:coverage

      # The API client is a git submodule compiled into the app.
      - name: animu-api typecheck + tests
        run: pnpm run check:animu-api

      # So is the audio player (its own Yarn install, removed afterwards).
      - name: react-native-anything-player typecheck + tests
        run: pnpm run check:player

      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

      # Bundles the app so broken asset paths and unresolvable imports fail CI
      # (TypeScript can't catch these — asset modules are declared by wildcard).
      - name: Bundle smoke test
        run: pnpm exec expo export:embed --platform android --entry-file index.js --bundle-output /tmp/index.android.bundle --assets-dest /tmp/animu-assets --dev false

      - name: Bundle size budget
        run: node scripts/check-bundle-size.mjs /tmp/index.android.bundle 3900000 /tmp/animu-assets 2000000

      # Fails the build on any React Doctor finding.
      # Advisory PR feedback lives in react-doctor.yml; this is the hard gate.
      # Uses the locally installed devDependency (lockfile-pinned) rather than
      # an unpinned `@latest` download.
      - name: React Doctor gate
        run: pnpm run doctor:gate

      - name: Publish reusable results
        run: node scripts/ci-results.mjs publish RadioAnimu/animu-mobile-app
      - name: Upload reusable results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results
          path: ci-results.json
          retention-days: 30
          if-no-files-found: error

  # The web export in real browsers (e2e/, Playwright): Chromium and WebKit,
  # which differ on the stream's CORS and the oscilloscope. The tests play the
  # live station, so stream.animu.moe and api.animu.moe must be reachable.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # init-submodules.sh needs the history: fetch it now, not unshallow later.
          fetch-depth: 0

      - name: Initialize pinned submodules
        run: bash scripts/init-submodules.sh

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      # The lockfile pins Playwright, so its browser builds follow its version.
      - name: Cache browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}

      # Downloads only what the cache lacks; the system libraries always.
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      # The Proxima Nova fonts are licensed and never leave the release hosts
      # (as in ios-release.yml). This export is not distributed, so any
      # TrueType font under their file names lets the web bundle resolve them.
      - name: Stand in for the licensed fonts
        run: |
          stand_in=node_modules/@react-native-vector-icons/material-icons/fonts/MaterialIcons.ttf
          cp "$stand_in" src/assets/fonts/proximanova-reg.ttf
          cp "$stand_in" src/assets/fonts/proximanova-bold.ttf

      - name: Web export + browser tests
        run: pnpm run test:web

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
