name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm exec expo lint

      - name: Test (with coverage)
        run: pnpm test:coverage

      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

      # Bundles the app so broken asset paths and unresolvable imports fail CI
      # (TypeScript can't catch these — asset modules are declared by wildcard).
      - name: Bundle smoke test
        run: pnpm exec expo export:embed --platform android --entry-file index.js --bundle-output /tmp/index.android.bundle --assets-dest /tmp/animu-assets --dev false

      # Fails the build if the React Doctor health score drops below the floor.
      # Advisory PR feedback lives in react-doctor.yml; this is the hard gate.
      # Uses the locally installed devDependency (lockfile-pinned) rather than
      # an unpinned `@latest` download.
      - name: React Doctor score gate
        run: |
          raw=$(pnpm exec react-doctor --score 2>/dev/null || true)
          score=$(printf '%s\n' "$raw" | grep -oE '^[0-9]+$' | tail -1)
          echo "React Doctor score: ${score:-<none>}"
          case "$score" in
            ''|*[!0-9]*) echo "::error::Could not parse a React Doctor score"; exit 1 ;;
          esac
          if [ "$score" -lt 85 ]; then
            echo "::error::React Doctor score $score is below the required minimum of 85"
            exit 1
          fi
