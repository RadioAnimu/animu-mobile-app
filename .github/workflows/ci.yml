name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Initialize pinned submodules
        run: bash scripts/init-submodules.sh

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Configure download stores
        run: |
          echo "YARN_GLOBAL_FOLDER=$RUNNER_TEMP/animu-yarn" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/animu-tools" >> "$GITHUB_ENV"

      - name: Cache isolated library downloads and verified tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.YARN_GLOBAL_FOLDER }}
            ${{ env.XDG_CACHE_HOME }}/animu-gitleaks-*
          key: ${{ runner.os }}-${{ runner.arch }}-library-downloads-${{ hashFiles('packages/react-native-anything-player/yarn.lock', 'scripts/check-secrets.mjs') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tooling regression tests
        run: pnpm run test:tooling

      - name: Native artifact and simulator helper regression tests
        run: python3 -m unittest discover -s scripts/__tests__ -p '*_test.py'

      - name: Typecheck
        run: pnpm run typecheck

      # Fails when an Expo-managed package drifts from the installed SDK's
      # validated version (packages deliberately off-SDK are listed in
      # expo.install.exclude).
      - name: Expo SDK dependency check
        run: pnpm run check:expo-deps

      # Project health: app config schema, duplicate native modules, SDK
      # compatibility, prebuild-config sync.
      - name: Expo Doctor
        run: pnpm run check:expo-doctor

      # Known-vulnerability gate on the resolved dependency tree.
      - name: Secret scan (complete app and library history)
        run: pnpm run check:secrets

      - name: Dependency audit
        run: pnpm run check:audit

      - name: Lint
        run: pnpm run lint

      - name: Test (with coverage)
        run: pnpm test:coverage

      # The API client is a git submodule compiled into the app.
      - name: animu-api typecheck + tests
        run: pnpm run check:animu-api

      # So is the audio player (its own Yarn install, removed afterwards).
      - name: react-native-anything-player typecheck + tests
        run: pnpm run check:player

      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

      # Bundles the app so broken asset paths and unresolvable imports fail CI
      # (TypeScript can't catch these — asset modules are declared by wildcard).
      - name: Bundle smoke test
        run: pnpm exec expo export:embed --platform android --entry-file index.js --bundle-output /tmp/index.android.bundle --assets-dest /tmp/animu-assets --dev false

      - name: Bundle size budget
        run: node scripts/check-bundle-size.mjs /tmp/index.android.bundle 3900000 /tmp/animu-assets 2000000

      # Fails on unreviewed findings; exact source reviews retain the full report.
      # Advisory PR feedback lives in react-doctor.yml; this is the hard gate.
      # Uses the locally installed devDependency (lockfile-pinned) rather than
      # an unpinned `@latest` download.
      - name: React Doctor gate
        run: pnpm run doctor:gate

      - name: Publish reusable results
        run: node scripts/ci-results.mjs publish RadioAnimu/animu-mobile-app
      - name: Upload reusable results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-results
          path: |
            ci-results.json
            react-doctor-report.json
          retention-days: 30
          if-no-files-found: error
