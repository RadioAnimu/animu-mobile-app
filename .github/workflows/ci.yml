name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install animu-api dependencies
        run: npm ci --prefix packages/animu-api

      - name: Build animu-api
        run: npm run build --prefix packages/animu-api

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

      - name: Test
        run: npm test

      # Bundles the app so broken asset paths and unresolvable imports fail CI
      # (TypeScript can't catch these — asset modules are declared by wildcard).
      - name: Bundle smoke test
        run: npx expo export:embed --platform android --entry-file index.js --bundle-output /tmp/index.android.bundle --assets-dest /tmp/animu-assets --dev false

      # Fails the build if the React Doctor health score drops below the floor.
      # Advisory PR feedback lives in react-doctor.yml; this is the hard gate.
      # Uses the locally installed devDependency (lockfile-pinned) rather than
      # an unpinned `@latest` download.
      - name: React Doctor score gate
        run: |
          score=$(npx react-doctor --score)
          echo "React Doctor score: $score"
          if [ "$score" -lt 85 ]; then
            echo "::error::React Doctor score $score is below the required minimum of 85"
            exit 1
          fi
