name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

# A newer push cancels a PR's older run. Every other run is a group of its own:
# a shared group keeps one pending run and drops the rest, and every main
# commit keeps its results (the release and Sonar reuse them).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Initialize pinned submodules
        run: bash scripts/init-submodules.sh

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Configure download stores
        run: |
          echo "YARN_GLOBAL_FOLDER=$RUNNER_TEMP/animu-yarn" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/animu-tools" >> "$GITHUB_ENV"

      - name: Cache isolated library downloads and verified tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.YARN_GLOBAL_FOLDER }}
            ${{ env.XDG_CACHE_HOME }}/animu-gitleaks-*
          key: ${{ runner.os }}-${{ runner.arch }}-library-downloads-${{ hashFiles('packages/react-native-anything-player/yarn.lock', 'scripts/check-secrets.mjs') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every check (scripts/verify.mjs, what `pnpm verify` runs locally and
      # Jenkins runs): tooling tests, typecheck, Expo deps and doctor,
      # secrets over the complete app and library history, audit, ESLint,
      # oxlint, knip + sherif, tests with coverage, both libraries, the
      # Android bundle and its size budget, the web export and React Doctor
      # (the hard gate; react-doctor.yml is the advisory PR feedback).
      # Independent steps run side by side; every step runs even after one
      # fails, and the summary at the end lists them all.
      - name: Verify
        run: pnpm verify

      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Publish reusable results
        run: node scripts/ci-results.mjs publish RadioAnimu/animu-mobile-app
      - name: Upload reusable results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results
          path: ci-results.json
          retention-days: 30
          if-no-files-found: error

  # The web export in real browsers (e2e/, Playwright): Chromium and WebKit,
  # which differ on the stream's CORS and the oscilloscope. The tests play the
  # live station, so stream.animu.moe and api.animu.moe must be reachable.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # init-submodules.sh needs the history: fetch it now, not unshallow later.
          fetch-depth: 0

      - name: Initialize pinned submodules
        run: bash scripts/init-submodules.sh

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      # The lockfile pins Playwright, so its browser builds follow its version.
      - name: Cache browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}

      # Downloads only what the cache lacks; the system libraries always.
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      # The Proxima Nova fonts are licensed and never leave the release hosts
      # (as in ios-release.yml). This export is not distributed, so any
      # TrueType font under their file names lets the web bundle resolve them.
      - name: Stand in for the licensed fonts
        run: |
          stand_in=node_modules/@react-native-vector-icons/material-icons/fonts/MaterialIcons.ttf
          cp "$stand_in" src/assets/fonts/proximanova-reg.ttf
          cp "$stand_in" src/assets/fonts/proximanova-bold.ttf

      - name: Web export + browser tests
        run: pnpm run test:web

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
