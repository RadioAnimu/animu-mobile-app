name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Initialize pinned submodules
        run: bash scripts/init-submodules.sh

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tooling regression tests
        run: pnpm run test:tooling

      - name: Typecheck
        run: pnpm run typecheck

      # Fails when an Expo-managed package drifts from the installed SDK's
      # validated version (packages deliberately off-SDK are listed in
      # expo.install.exclude).
      - name: Expo SDK dependency check
        run: pnpm run check:expo-deps

      # Project health: app config schema, duplicate native modules, SDK
      # compatibility, prebuild-config sync.
      - name: Expo Doctor
        run: pnpm run check:expo-doctor

      # Known-vulnerability gate on the resolved dependency tree.
      - name: Secret scan (complete app and library history)
        run: pnpm run check:secrets

      - name: Dependency audit
        run: pnpm run check:audit

      - name: Lint
        run: pnpm run lint

      - name: Test (with coverage)
        run: pnpm test:coverage

      # The API client is a git submodule compiled into the app.
      - name: animu-api typecheck + tests
        run: pnpm run check:animu-api

      # So is the audio player (its own Yarn install, removed afterwards).
      - name: react-native-anything-player typecheck + tests
        run: pnpm run check:player

      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

      # Bundles the app so broken asset paths and unresolvable imports fail CI
      # (TypeScript can't catch these — asset modules are declared by wildcard).
      - name: Bundle smoke test
        run: pnpm exec expo export:embed --platform android --entry-file index.js --bundle-output /tmp/index.android.bundle --assets-dest /tmp/animu-assets --dev false

      - name: Bundle size budget
        run: node scripts/check-bundle-size.mjs /tmp/index.android.bundle 3500000 /tmp/animu-assets 2000000

      # Fails the build on any React Doctor finding.
      # Advisory PR feedback lives in react-doctor.yml; this is the hard gate.
      # Uses the locally installed devDependency (lockfile-pinned) rather than
      # an unpinned `@latest` download.
      - name: React Doctor gate
        run: pnpm run doctor:gate
