name: iOS native release validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  archive:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CI: true
      GH_TOKEN: ${{ github.token }}
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Initialize pinned libraries
        run: bash scripts/init-submodules.sh
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Record Apple toolchain
        run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Stage licensed build fonts
        env:
          IOS_BUILD_FONT_ARCHIVE_1: ${{ secrets.IOS_BUILD_FONT_ARCHIVE_1 }}
          IOS_BUILD_FONT_ARCHIVE_2: ${{ secrets.IOS_BUILD_FONT_ARCHIVE_2 }}
          IOS_BUILD_FONT_ARCHIVE_3: ${{ secrets.IOS_BUILD_FONT_ARCHIVE_3 }}
          IOS_BUILD_FONT_ARCHIVE_4: ${{ secrets.IOS_BUILD_FONT_ARCHIVE_4 }}
          IOS_BUILD_FONT_ARCHIVE_5: ${{ secrets.IOS_BUILD_FONT_ARCHIVE_5 }}
        run: node scripts/stage-ci-fonts.mjs
      - name: Generate the iOS application
        run: pnpm exec expo prebuild --platform ios --no-install
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1
        with:
          ruby-version: '3.3'
          working-directory: packages/react-native-anything-player/example
          bundler-cache: true
      - name: Install native dependencies
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/packages/react-native-anything-player/example/Gemfile
        run: |
          bundle exec pod install --project-directory=ios
          cp ios/Podfile.lock "$RUNNER_TEMP/Podfile.lock"
      - name: Archive Release for iPhone without distribution signing
        run: |
          set -o pipefail
          xcodebuild -workspace ios/RdioAnimu.xcworkspace -scheme RdioAnimu \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Animu.xcarchive" \
            archive CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/ios-archive.log"
      - name: Verify archive metadata and privacy manifests
        run: |
          python3 scripts/validate-ios-archive.py "$RUNNER_TEMP/Animu.xcarchive" app.json > "$RUNNER_TEMP/ios-archive-validation.json"
      - name: Build Release for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -workspace ios/RdioAnimu.xcworkspace -scheme RdioAnimu \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-simulator-build" \
            build CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/ios-simulator-build.log"
      - name: Verify Release process survival
        run: python3 scripts/smoke-ios-simulator.py "$RUNNER_TEMP/ios-simulator-build/Build/Products/Release-iphonesimulator/RdioAnimu.app" "$RUNNER_TEMP"
      - name: Configure the separate Release UI smoke scheme
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/packages/react-native-anything-player/example/Gemfile
        run: bundle exec ruby scripts/prepare-ios-ui-smoke.rb ios
      - name: Verify assistant play delivery through the Release UI
        run: |
          set -o pipefail
          UDID=$(python3 -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "ios-simulator-smoke.json")))["udid"])')
          xcodebuild test -workspace ios/RdioAnimu.xcworkspace -scheme AnimuReleaseSmoke \
            -configuration Release -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/ios-simulator-build" \
            -resultBundlePath "$RUNNER_TEMP/ios-ui-smoke.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/ios-ui-smoke.log"
      - name: Upload native validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-native-validation
          path: |
            ${{ runner.temp }}/ios-archive.log
            ${{ runner.temp }}/ios-archive-validation.json
            ${{ runner.temp }}/Podfile.lock
            ${{ runner.temp }}/ios-simulator-build.log
            ${{ runner.temp }}/ios-simulator-smoke.json
            ${{ runner.temp }}/ios-launch.png
            ${{ runner.temp }}/ios-ui-smoke.log
            ${{ runner.temp }}/ios-ui-smoke.xcresult
          if-no-files-found: warn
