# React Doctor — finds security, performance, correctness, accessibility,
# bundle-size, and architecture issues in React codebases.
#
# Docs: https://www.react.doctor/ci
# Source: https://github.com/millionco/react-doctor

name: React Doctor

on:
  # Scans the whole project on each PR and posts a sticky summary comment.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Scans `main` on every push to track the health-score trend and catch regressions that slipped past PR review.
  push:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

# Cancels any in-flight scan for the same PR (or branch, on push) the moment a new commit arrives, so reviewers only ever see the latest run.
concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gives React Doctor the full git history it needs to find the merge base with the target branch. Without it a shallow checkout has no merge base, so PR runs can't compare against the base and fall back to reporting every issue in the changed files (pre-existing ones included) instead of only the ones the PR introduced.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Scans the whole project and blocks on any finding, like the CI gate
      # (scripts/react-doctor-gate.mjs), so this status cannot read green
      # while CI is red. On pull requests it also posts the sticky summary and
      # inline comments. Full reference: https://www.react.doctor/ci
      #
      # Pinned to a commit for supply-chain safety — a floating major tag can
      # move under us. Bump deliberately.
      - uses: millionco/react-doctor@695e46eee203a5d1855020191aa7e9c010a1250e  # v2.4.0
        with:
          blocking: warning
          scope: full
          # The CLI version the lockfile resolves (checked by test:tooling):
          # without an install step the action would otherwise fetch "latest".
          version: "0.9.17"
