# ccache configuration for Android release builds.
#
# Installed on the build host as ~/.config/ccache/ccache.conf (or pointed at via
# CCACHE_CONFIGPATH). The pipeline sets CCACHE_DIR to a persistent workspace path.
#
# base_dir + hash_dir=false make the cache relocatable: object hashes are
# computed relative to base_dir and ignore the current working directory, so a
# recompile still hits even when the build directory changes (expo prebuild
# regenerates android/, EAS/local builds use fresh temp dirs).

base_dir = /home/rmotafreitas
hash_dir = false

# Native objects across 4 ABIs are large; keep a generous cache.
max_size = 20G

# Let ccache serve the compiler probe from cache rather than re-statting it.
compiler_check = content
