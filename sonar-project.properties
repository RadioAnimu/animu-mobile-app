# SonarQube analysis configuration for animu-mobile-app.
# Consumed by SonarScanner (see Jenkinsfile.sonar). The server runs locally;
# the pipeline injects sonar.host.url and SONAR_TOKEN — never commit a token.

sonar.projectKey=RadioAnimu_animu-mobile-app
sonar.projectName=animu-mobile-app
sonar.sourceEncoding=UTF-8

# Application code.
sonar.sources=App.tsx,index.js,src

# Colocated tests (src/**/__tests__) are classified as tests, not sources, so
# they don't skew coverage/complexity metrics for production code.
sonar.tests=src
sonar.test.inclusions=src/**/__tests__/**

sonar.exclusions=**/node_modules/**,android/**,ios/**,dist/**,.expo/**,coverage/**,packages/**,assets/**
